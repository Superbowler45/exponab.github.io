<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Products — Exponab</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="site">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/index.html">
        <img src="/assets/logo/exponab-logo.png" alt="Exponab" id="site-logo">
      </a>
      <nav class="main-nav">
        <a href="/index.html">Home</a>
        <a href="/products.html" class="active">Products</a>
        <a href="/services.html">Services</a>
        <a href="/about.html">About</a>
        <a href="/contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="container">
      <h1 id="fruits">Fruits</h1>
      <p class="muted">Fresh fruits we source and supply.</p>
      <div class="grid products-grid">
        <!-- example card -->
        <article class="product-card">
          <img src="/assets/products/fruits/pomegranate.png" alt="Pomegranate">
          <div class="product-name">Pomegranate</div>
        </article>

        <article class="product-card">
          <img src="/assets/products/fruits/green-grapes.png" alt="Green Grapes">
          <div class="product-name">Grapes (Green)</div>
        </article>

        <!-- add more product cards using image paths -->
      </div>

      <h2 id="vegetables">Vegetables</h2>
      <div class="grid products-grid">
        <article class="product-card">
          <img src="/assets/products/vegetables/onion.png" alt="Onion">
          <div class="product-name">Onion</div>
        </article>
        <article class="product-card">
          <img src="/assets/products/vegetables/green-chilli.png" alt="Green Chilli">
          <div class="product-name">Green Chilli</div>
        </article>
      </div>

      <h2 id="staples">Staples & Pulses</h2>
      <div class="grid products-grid">
        <article class="product-card">
          <img src="/assets/products/staples/turmeric.jpg" alt="Turmeric">
          <div class="product-name">Turmeric</div>
        </article>
        <article class="product-card">
          <img src="/assets/products/staples/ba s mati-rice.jpg" alt="Rice">
          <div class="product-name">Rice</div>
        </article>
      </div>

      <h2 id="meat">Meat & Fish</h2>
      <div class="grid products-grid">
        <article class="product-card">
          <img src="/assets/products/meat/chicken.jpg" alt="Chicken">
          <div class="product-name">Chicken</div>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-left">
        <img src="/assets/logo/exponab-logo.png" alt="Exponab" class="footer-logo" />
        <p class="muted">Dubai-based import & export trading company.</p>
      </div>
    </div>
    <div class="footer-bottom">
      <div class="container">© 2025 Exponab. All rights reserved.</div>
    </div>
  </footer>

  <script src="/script.js" defer></script>
</body>
</html>
