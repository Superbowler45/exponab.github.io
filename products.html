<!doctype html>

  <link rel="stylesheet" href="style.css">

<body>
  <header class="site-header">

        <img src="assets/logo/exponab-logo.png" alt="Exponab" class="brand-logo">
        <span class="brand-text">Exponab</span>

      <nav class="main-nav">
